<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6feb">
  <title>Potjes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Potjes</h1>
    <div id="ingelogd" hidden><span id="wie"></span> <button class="link" id="logout">uitloggen</button></div>
  </header>

  <div id="melding" class="melding" hidden></div>

  <section id="uitgelogd" class="kaart midden">
    <h2>Huishoudbudget Ricky &amp; Dorien</h2>
    <p>Log in met je Google-account.</p>
    <button class="knop" id="login">Inloggen met Google</button>
  </section>

  <main id="app" hidden>
    <div id="ingelogd-inhoud">
      <nav>
        <button data-tab="maand" class="actief">Deze maand</button>
        <button data-tab="toewijzen">Toewijzen <span id="teller" class="teller"></span></button>
        <button data-tab="import">Importeren</button>
        <button data-tab="instellingen">Instellingen</button>
      </nav>
      <div id="inhoud"></div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
